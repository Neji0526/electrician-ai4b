<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#175bb4" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Deliberately no title element here. React 19 hoists the one rendered by
      the Seo component into this head, and it does not dedupe against a tag
      that was already in the document — a static one would sit first in
      document order and win, pinning every page to the same title. The tab
      shows the URL for the few hundred milliseconds before the app mounts;
      that is the cost of the SPA build.
    -->
  </head>
  <body class="bg-white antialiased">
    <div id="root" class="flex min-h-screen flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
